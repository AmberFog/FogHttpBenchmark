repos:
  - repo: local
    hooks:
      - id: check-all-position
        name: check __all__ position
        entry: python scripts/check_all_position.py
        language: python
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: pretty-format-json
        args:
          - "--indent=2"
          - "--autofix"
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      - id: add-trailing-comma

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.1
    hooks:
      - id: uv-lock
        args: [--check]
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-format
      - id: ruff-check
        args:
          - --fix
          - --unsafe-fixes

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        pass_filenames: false
        types_or: [file]  # Include pyproject.toml and uv.lock through the files filter.
        args:
          - --config-file=pyproject.toml
          - --python-executable=.venv/bin/python
        files: ^(foghttp_benchmark/.*\.pyi?$|pyproject\.toml$|uv\.lock$)
