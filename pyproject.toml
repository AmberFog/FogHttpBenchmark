[build-system]
requires = [
    "setuptools>=77",
]
build-backend = "setuptools.build_meta"

[project]
name = "foghttp-benchmark"
version = "0.1.0"
description = "Reproducible benchmarks for FogHTTP and comparable Python HTTP clients."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "AMBER FOG" },
]
dependencies = [
    "aiohttp>=3.12,<4",
    "brotli>=1.1,<2",
    "faker>=33",
    "foghttp>=0.4.0,<0.5",
    "httpx>=0.28,<1",
    "httpxyz>=0.31,<1",
    "jinja2>=3.1,<4",
    "psutil>=6,<8",
    "rich>=15,<16",
    "typer>=0.16,<1",
    "zapros[pyreqwest]>=0.11,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4,<3",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.17.1,<1",
]

[project.scripts]
foghttp-benchmark = "foghttp_benchmark.cli:app"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.setuptools.packages.find]
include = [
    "foghttp_benchmark*",
]

[tool.setuptools.package-data]
foghttp_benchmark = [
    "templates/*.j2",
]

[tool.mypy]
python_version = "3.11"
files = [
    "foghttp_benchmark",
]
strict = true
warn_unreachable = true
warn_unused_configs = true
pretty = true
show_error_codes = true
namespace_packages = false

[tool.typos.default.extend-identifiers]
CPY001 = "CPY001"
